[package]
name = "tripgrant"
version = "0.1.0"
description = "Single-settlement travel grant escrow"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tripgrant"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
local-test-mint = []

[dependencies]
anchor-lang = "=1.2.1"
anchor-spl = { version = "=1.2.1", default-features = false, features = ["token", "token_2022", "solana-v3"] }
